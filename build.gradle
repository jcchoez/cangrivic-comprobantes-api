plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.facturas'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 🔹 Dependencias principales de Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation' // Agrega esta líne

	implementation  'com.auth0:java-jwt:4.3.0'



	// 🔹 RabbitMQ (si lo usas)
	//implementation 'org.springframework.boot:spring-boot-starter-amqp'

	// 🔹 Hibernate y Base de Datos
	runtimeOnly 'com.mysql:mysql-connector-j'
	// 🔹 Lombok (para reducir código boilerplate)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Agregar Spring Batch
	//implementation 'org.springframework.boot:spring-boot-starter-batch'

	// 🔹 HATEOAS (solo si trabajas con enlaces en APIs REST)
	// implementation 'org.springframework.boot:spring-boot-starter-hateoas'



	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'



	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


	// Usar Hibernate Validator en lugar||	 de javax.validation-api
	/*implementation 'org.hibernate.validator:hibernate-validator:6.2.0.Final'
	implementation 'org.glassfish:javax.el:3.0.0'*/
}

tasks.named('test') {
	useJUnitPlatform()
}
